[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynan"
version = "0.1.0"
description = "dynAn - dynamic security patch validation and regression testing for C/C++ ELF targets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "dynAn team" }]
keywords = ["security", "patch-validation", "sanitizer", "regression", "ci"]

dependencies = [
    "pydantic>=2.6,<3",
    "PyYAML>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
llm = [
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.2",
    "httpx>=0.27",
]

[project.scripts]
dynan = "dynan.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dynan = [
    "web/templates/*.html",
    "web/static/*.css",
    "web/static/*.js",
    "ext/llm/prompts/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# dynAn has a domain enum named TestOutcome; without this pytest tries to
# collect it as a test class.
python_classes = []
markers = [
    "integration: tests that compile and execute real C fixtures",
    "slow: longer running end-to-end tests",
]
filterwarnings = ["ignore::DeprecationWarning"]
