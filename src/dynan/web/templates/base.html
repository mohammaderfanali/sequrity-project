<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ product }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>&#9679;</text></svg>">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">{{ product }} <span>{{ version }}</span></a>
    <nav class="nav">
      <a href="/" class="{{ 'active' if nav == 'runs' }}">Runs</a>
      <a href="/new" class="{{ 'active' if nav == 'new' }}">New validation</a>
      <a href="/doctor" class="{{ 'active' if nav == 'doctor' }}">Environment</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
